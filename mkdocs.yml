site_name: Junyoung IP Wiki
site_description: 개인 IP·특허 학습 Wiki
site_url: https://seok-junyoung.github.io/IP-Audit/

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - 홈: index.md
  - 용어사전:
      - 명세서 기초:
          - 명세서의 구성과 역할: glossary/specification-basics.md
          - 명세서 주의 사항: glossary/specification-cautions.md
  - 인터뷰:
      - 고등급 특허 다출원 엔지니어: interview/high-grade-patent-inventor-interview.md
  - 예상 현안:
      - 출원 프로세스 예상 현안: audit/expected-issues.md
      - 특허 등급체계 현안 및 대책: audit/patent-grade-improvement.md
      - 외부대리인 선정·배정: audit/external-counsel-allocation.md

plugins:
  - search:
      lang: ko

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
