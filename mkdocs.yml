site_name: Junyoung IP Wiki
site_description: 개인 IP·특허 학습 Wiki
site_url: https://seok-junyoung.github.io/IP-Audit/

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - 홈: index.md
  - 용어사전:
      - 명세서 기초:
          - 명세서의 구성과 역할: glossary/specification-basics.md

plugins:
  - search:
      lang: ko

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
